name: CI

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "qrcode[pil]==8.2" "opencv-python-headless==5.0.0.93"
      - run: python -m unittest discover -s tests -v
      - name: run.sh instala a dependência num venv isolado
        run: |
          python -m pip uninstall -y qrcode
          PIX_VENV="$RUNNER_TEMP/venv" bash skills/pix/scripts/run.sh pix@exemplo.com 10 --terminal escuro --saida "$RUNNER_TEMP/pix.png"
          test -s "$RUNNER_TEMP/pix.png"

  manifestos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
      - run: npx -y @anthropic-ai/claude-code@2.1.293 plugin validate . --strict
      - run: npx -y @anthropic-ai/claude-code@2.1.293 plugin validate .claude-plugin/plugin.json --strict
